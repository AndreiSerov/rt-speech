# Commit-safe settings only. Secrets belong in .env.

[logging]
level = "INFO"  # DEBUG, INFO, WARNING or ERROR

[replay]
realtime = false  # true paces FileSource like live audio; false replays as fast as possible

[capture]
binary = "native/capture/.build/release/rt-capture"  # relative to where you run from

[segmenter]
voice_threshold = 0.5       # Silero score from which a frame counts as voiced
speech_start_frames = 3     # consecutive voiced frames needed to enter speech
silence_end_ms = 600        # silence that closes a Segment
preroll_ms = 300            # audio kept before the first voiced frame
postroll_ms = 200           # audio kept after the last voiced frame
min_speech_ms = 300         # shorter speech is dropped; pre-roll and post-roll don't count
max_segment_ms = 18000      # hard cap on a Segment
split_search_ms = 2000      # how far back from the cap to look for a quiet point
split_window_ms = 100       # how long a quiet point must be; shorter gaps can be inside a word

[stt]
engine = "mlx-whisper"      # or "faster-whisper"; each is an optional install
language = "ru"             # ru, en or auto
# system_language = "auto"  # overrides for one Stream
# mic_language = "ru"
queue_warning_segments = 5  # warn when more Segments than this await transcription

[stt.mlx_whisper]
model = "mlx-community/whisper-large-v3-turbo"

[stt.mlx_whisper.filter]
no_speech_threshold = 0.6     # dropped only if no_speech_prob is above this...
avg_logprob_threshold = -1.0  # ...and avg_logprob is below this
near_silence_rms = 0.01       # filler phrases are dropped only below this level
filler_phrases = ["Спасибо за просмотр", "Субтитры сделал DimaTorzok", "Продолжение следует", "Thanks for watching", "Thank you", "You"]

[stt.faster_whisper]
model = "large-v3-turbo"
compute_type = "int8"

[stt.faster_whisper.filter]
no_speech_threshold = 0.6
avg_logprob_threshold = -1.0
near_silence_rms = 0.01
filler_phrases = ["Спасибо за просмотр", "Субтитры сделал DimaTorzok", "Продолжение следует", "Thanks for watching", "Thank you", "You"]

[turns]
pause_ms = 1800  # silence that closes a Turn

[suggester]
engine = "dummy"       # "dummy" prints placeholder Suggestions, "off" prints none
recent_turns = 10      # how many Turns a Suggestion is based on
timeout_seconds = 10   # how long to wait for one before giving up
